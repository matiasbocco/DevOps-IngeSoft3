name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-backend:
    runs-on: ubuntu-latest
    # Mínimo privilegio: solo los jobs que publican reciben permiso de escribir paquetes.
    permissions:
      contents: read
      packages: write
    steps:
      - name: Qué estamos verificando
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA · commit $GITHUB_SHA"

      - name: Bajar el código al runner
        uses: actions/checkout@v6

      - name: Preparar el constructor que sabe cachear
        uses: docker/setup-buildx-action@v4

      - name: Construir la etapa de tests
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          target: test
          load: true
          push: false
          tags: backend-test:ci
          cache-from: type=gha,scope=backend-test
          cache-to: type=gha,mode=max,scope=backend-test

      - name: Correr los tests con coverage
        run: |
          docker run --rm -v "${{ github.workspace }}/TestResults:/out" backend-test:ci

      - name: Reporte de coverage
        if: ${{ !cancelled() }}
        run: |
          dotnet tool install -g dotnet-reportgenerator-globaltool
          reportgenerator -reports:"TestResults/**/coverage.cobertura.xml" -sourcedirs:backend \
            -targetdir:coveragereport "-reporttypes:Html;MarkdownSummaryGithub"
          cat coveragereport/SummaryGithub.md >> $GITHUB_STEP_SUMMARY

      - name: Publicar coverage y resultados
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: coverage-report
          path: |
            coveragereport
            TestResults/tests.trx

      - name: Entrar al registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ÚLTIMO paso del job: si los tests fallan, el job muere antes y esto nunca corre.
      # El nombre va en minúsculas a mano: el repo tiene mayúsculas y ghcr no las acepta.
      - name: Construir y publicar la imagen del backend
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/matiasbocco/devops-ingesoft3-backend:sha-${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  build-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Qué estamos verificando
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA · commit $GITHUB_SHA"

      - name: Bajar el código al runner
        uses: actions/checkout@v6

      - name: Preparar el constructor que sabe cachear
        uses: docker/setup-buildx-action@v4

      - name: Construir la etapa de tests
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          target: test
          load: true
          push: false
          tags: frontend-test:ci
          cache-from: type=gha,scope=frontend-test
          cache-to: type=gha,mode=max,scope=frontend-test

      - name: Correr los tests con coverage
        run: |
          docker run --rm -v "${{ github.workspace }}/frontend/coverage:/app/coverage" frontend-test:ci

      - name: Publicar coverage del frontend
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: coverage-report-frontend
          path: frontend/coverage

      - name: Entrar al registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar la imagen del frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/matiasbocco/devops-ingesoft3-frontend:sha-${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # --- Entrega continua (plan C: self-hosted runner + docker compose) -------------------
  # Cadena: build → deploy-qa → integracion → e2e → [aprobación] → deploy-prod.
  # QA y PROD EJECUTAN la imagen sha-<commit> que publicaron los jobs de build: nada se
  # reconstruye en el servidor, así que lo que se prueba en QA es lo que llega a PROD.
  deploy-qa:
    runs-on: self-hosted
    needs: [build-backend, build-frontend]
    if: github.ref == 'refs/heads/main'
    environment: qa
    permissions:
      contents: read
    env:
      POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
      IMAGE_TAG: sha-${{ github.sha }}
    steps:
      - name: Bajar los compose del commit verificado
        uses: actions/checkout@v6

      - name: Deploy QA con la imagen del registry
        run: |
          echo "Imagen a desplegar: $IMAGE_TAG"
          docker compose -f compose.qa.yml pull
          docker compose -f compose.qa.yml up -d

      - name: Smoke test de QA (con reintentos)
        shell: bash
        env:
          URL_API: http://localhost:8080
          URL_FRONT: http://localhost:3000
        run: |
          echo "Esperando a que QA esté vivo..."
          for i in $(seq 1 30); do
            if curl -fsS --max-time 10 "$URL_API/health" \
               && curl -fsS --max-time 10 "$URL_API/api/items" > /dev/null \
               && curl -fsS --max-time 10 "$URL_FRONT/" > /dev/null \
               && curl -fsS --max-time 10 "$URL_FRONT/api/items" > /dev/null; then
              echo "✅ QA responde (API + BD + front + proxy)"; exit 0
            fi
            echo "Intento $i/30 sin respuesta, reintento en 20 s"
            sleep 20
          done
          echo "❌ QA no respondió a tiempo"; exit 1

  # Integración amplia: pedidos HTTP directo a la api de QA, con su Postgres de verdad.
  # Corre dentro de la imagen oficial de Playwright (Node + navegadores ya instalados) con
  # --network host para llegar a localhost:8080 del servidor, y como el usuario del runner
  # para que los archivos generados se puedan limpiar en la próxima corrida.
  integracion:
    runs-on: self-hosted
    needs: deploy-qa
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Integración contra la api de QA
        shell: bash
        run: |
          docker run --rm --network host --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -e CI=true -e API_BASE_URL=http://localhost:8080 \
            -v "$GITHUB_WORKSPACE/frontend:/work" -w /work \
            mcr.microsoft.com/playwright:v1.64.0-noble \
            bash -c "npm ci && npx playwright test e2e/api.spec.js"

      - name: Publicar reporte de integración
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-integracion
          path: frontend/playwright-report
          retention-days: 7

  # e2e: un navegador real usa la app completa de QA (front → nginx → api → base).
  # Si la integración falla, ni se gasta un navegador en confirmarlo.
  e2e:
    runs-on: self-hosted
    needs: integracion
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: e2e contra QA
        shell: bash
        run: |
          docker run --rm --network host --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -e CI=true -e E2E_BASE_URL=http://localhost:3000 \
            -v "$GITHUB_WORKSPACE/frontend:/work" -w /work \
            mcr.microsoft.com/playwright:v1.64.0-noble \
            bash -c "npm ci && npx playwright test e2e/inventario.spec.js"

      - name: Publicar reporte e2e
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-e2e
          path: frontend/playwright-report
          retention-days: 7

  # EL gate: sin e2e verde ni siquiera se pide aprobación. No repite el if de rama: lo
  # hereda por la cadena. Despliega la MISMA imagen sha-<commit> que verificaron QA y las suites.
  deploy-prod:
    runs-on: self-hosted
    needs: e2e
    environment: production
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
      IMAGE_TAG: sha-${{ github.sha }}
    steps:
      - name: Bajar los compose del commit verificado
        uses: actions/checkout@v6

      - name: Deploy PROD con la MISMA imagen que QA
        run: |
          echo "Imagen a desplegar: $IMAGE_TAG"
          docker compose -f compose.prod.yml pull
          docker compose -f compose.prod.yml up -d

      - name: Smoke test de PROD (con reintentos)
        shell: bash
        env:
          URL_API: http://localhost:8081
          URL_FRONT: http://localhost:3001
        run: |
          echo "Esperando a que PROD esté vivo..."
          for i in $(seq 1 30); do
            if curl -fsS --max-time 10 "$URL_API/health" \
               && curl -fsS --max-time 10 "$URL_API/api/items" > /dev/null \
               && curl -fsS --max-time 10 "$URL_FRONT/" > /dev/null \
               && curl -fsS --max-time 10 "$URL_FRONT/api/items" > /dev/null; then
              echo "✅ PROD responde (API + BD + front + proxy)"; exit 0
            fi
            echo "Intento $i/30 sin respuesta, reintento en 20 s"
            sleep 20
          done
          echo "❌ PROD no respondió a tiempo"; exit 1
